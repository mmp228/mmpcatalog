<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Каталог контента MMP</title>
<meta name="description" content="Каталог контента MATVEY MONTAGE PRODUCTION: новости, клипы, выступления и закулисье.">
<meta property="og:title" content="Каталог контента MMP"><meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23ff4f00'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0e0d;--panel:#171716;--panel2:#121211;--ink:#f2f2ef;--mute:#8d8d85;--line:#2a2a27;--acc:#ff4f00;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;--sans:'Onest','Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark;scroll-behavior:smooth}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;padding:clamp(12px,3vw,32px);
 background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:48px 48px}
a{color:inherit;text-decoration:none}
button,input{font:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.mono{font-family:var(--mono);font-size:12px;color:var(--mute);letter-spacing:.02em}

.top{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.01em}
.dot{width:12px;height:12px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px rgba(255,79,0,.15);animation:blink 2s steps(2,end) infinite}
@keyframes blink{50%{opacity:.35}}
.tg{font-family:var(--mono);font-size:13px;border:1px solid var(--ink);border-radius:999px;padding:8px 16px;transition:background .15s,color .15s}
.tg:hover{background:var(--ink);color:var(--bg)}

.hero{padding:clamp(22px,4vw,44px);display:grid;gap:18px}
.kicker{font-family:var(--mono);font-size:12px;color:var(--acc);letter-spacing:.08em}
.hero h1{font-size:clamp(40px,8vw,92px);line-height:.92;font-weight:800;letter-spacing:-.045em}
.q{width:min(420px,100%);font-size:15px;padding:12px 16px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink)}
.q::placeholder{color:var(--mute)}

.feat{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:clamp(18px,3vw,28px);background:linear-gradient(120deg,#1d1d1b,#0b0b0a)}
.feat .lbl{display:flex;gap:10px;align-items:center}
.feat h2{font-size:clamp(24px,4vw,40px);font-weight:800;letter-spacing:-.02em;margin-top:8px;line-height:1.1}
.btnp{font-family:var(--mono);font-weight:700;font-size:14px;background:var(--acc);color:#fff;border:0;border-radius:6px;padding:14px 22px;cursor:pointer;box-shadow:0 4px 0 #a83300;transition:transform .08s,box-shadow .08s}
.btnp:hover{transform:translateY(2px);box-shadow:0 2px 0 #a83300}
.btnp:active{transform:translateY(4px);box-shadow:none}
.led{width:8px;height:8px;border-radius:50%;background:var(--acc);animation:blink 1.6s steps(2,end) infinite}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:13px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--ink)}
.chip[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:4px 2px}
.head h2{font-size:20px;font-weight:800;letter-spacing:-.01em}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{display:flex;flex-direction:column;background:var(--panel2);border:1px solid var(--line);border-radius:10px;overflow:hidden;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--acc)}
.card:hover .play{background:var(--acc);color:#fff;border-color:var(--acc)}
.art{aspect-ratio:16/9;display:grid;place-items:center;background:
 repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 12px),
 linear-gradient(135deg,#222220,#0b0b0a)}
.play{width:52px;height:52px;border-radius:50%;border:1px solid var(--mute);display:grid;place-items:center;font-size:16px;color:var(--ink);transition:background .15s,color .15s,border-color .15s;padding-left:3px}
.body{padding:14px 16px 16px;display:grid;gap:6px}
.cat{font-family:var(--mono);font-size:11px;color:var(--acc);letter-spacing:.04em;text-transform:uppercase}
.title{font-size:16px;font-weight:700;line-height:1.3}
.empty{grid-column:1/-1;padding:28px 18px;text-align:center}

footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:4px 2px}

.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:clamp(10px,3vw,32px)}
.mbox{width:min(820px,100%,calc((100vh - 110px)*1.7778));min-width:min(100%,300px);display:grid;gap:10px}
.mbar{display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--mono);font-size:13px}
.mbar b{font-family:var(--sans);font-size:18px;font-weight:800}
.mbar .r{display:flex;gap:8px;align-items:center}
.mbar a{border:1px solid var(--mute);border-radius:999px;padding:6px 12px}
.mx{font-family:var(--mono);font-weight:700;font-size:14px;background:var(--acc);color:#fff;border:0;border-radius:6px;padding:10px 16px;cursor:pointer;box-shadow:0 3px 0 #a83300}
.mx:active{transform:translateY(3px);box-shadow:none}
.mv{aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden}
.mv iframe,.mv video{width:100%;height:100%;border:0;display:block}
.mv.tg{aspect-ratio:auto;background:#fff;overflow:auto}
.mv.tg iframe{height:min(560px,calc(100vh - 110px));min-height:360px}

@media(max-width:720px){
 .feat{grid-template-columns:1fr}
 .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
 .play{width:42px;height:42px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<div class="wrap">
 <header class="box top">
  <a class="brand" href="#"><span class="dot"></span>Каталог контента MMP</a>
  <a class="tg" href="https://t.me/mmpcatalog" target="_blank" rel="noopener">Telegram-канал</a>
 </header>

 <section class="box hero">
  <p class="kicker">MATVEY MONTAGE PRODUCTION</p>
  <h1>Каталог<br>контента</h1>
  <input class="q" id="q" type="search" placeholder="Поиск по названию" aria-label="Поиск по названию" autocomplete="off">
 </section>

 <section class="box feat" id="feat" hidden>
  <div>
   <div class="lbl"><span class="led"></span><span class="mono">новое</span></div>
   <p class="cat" id="fCat" style="margin-top:14px"></p>
   <h2 id="fTitle"></h2>
  </div>
  <button class="btnp" id="fBtn" type="button">▶ Смотреть</button>
 </section>

 <nav class="chips" id="chips" aria-label="Категории"></nav>

 <div class="head"><h2 id="ttl">Все видео</h2><span class="mono" id="cnt"></span></div>
 <section class="grid" id="grid" aria-live="polite"></section>

 <footer class="mono"><span>MATVEY MONTAGE PRODUCTION</span><span>Каталог контента MMP</span></footer>
</div>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-label="Плеер">
 <div class="mbox">
  <div class="mbar"><b id="mTitle"></b><span class="r"><a id="mOpen" target="_blank" rel="noopener">в новой вкладке</a><button class="mx" id="mClose" type="button">Закрыть</button></span></div>
  <div class="mv" id="mv"></div>
 </div>
</div>

<script>
var CATS=[],ITEMS=[],STATE='load';
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function catName(k){var c=CATS.find(function(c){return c.k===k});return c?c.t:''}

function embed(u){
 var m;
 if(m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/))return{t:'f',s:'https://www.youtube-nocookie.com/embed/'+m[1]+'?autoplay=1&rel=0'};
 if(m=u.match(/vimeo\.com\/(?:video\/)?(\d+)/))return{t:'f',s:'https://player.vimeo.com/video/'+m[1]+'?autoplay=1'};
 if(m=u.match(/kinescope\.io\/(?:embed\/|watch\/)?([A-Za-z0-9]{10,})/))return{t:'f',s:'https://kinescope.io/embed/'+m[1]};
 if(m=u.match(/^https?:\/\/t\.me\/([A-Za-z][A-Za-z0-9_]{3,})\/(\d+)/))return{t:'f',tg:1,s:'https://t.me/'+m[1]+'/'+m[2]+'?embed=1&mode=tme'};
 if(m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/))return{t:'f',s:'https://drive.google.com/file/d/'+m[1]+'/preview'};
 if(/\.(mp4|webm|mov)(\?|$)/i.test(u))return{t:'v',s:u};
 return null;
}
function openPlayer(i){
 var x=ITEMS[i],e=x&&embed(x.u);
 if(!e){window.open(x.u,'_blank','noopener');return}
 $('mTitle').textContent=x.t;$('mOpen').href=x.u;
 $('mv').className='mv'+(e.tg?' tg':'');
 $('mv').innerHTML=e.t==='v'?'<video src="'+esc(e.s)+'" controls autoplay playsinline></video>':'<iframe src="'+esc(e.s)+'" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>';
 $('modal').hidden=false;document.body.style.overflow='hidden';$('mClose').focus();
}
function closePlayer(){$('modal').hidden=true;$('mv').innerHTML='';$('mv').className='mv';document.body.style.overflow=''}
$('mClose').onclick=closePlayer;
$('modal').addEventListener('click',function(e){if(e.target===$('modal'))closePlayer()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('modal').hidden)closePlayer()});

function render(){
 var key=location.hash.slice(1),cur=CATS.find(function(c){return c.k===key}),q=$('q').value.trim().toLowerCase();
 $('chips').innerHTML='<a class="chip" href="#"'+(cur?'':' aria-current="page"')+'>Все</a>'+CATS.map(function(c){return '<a class="chip" href="#'+esc(c.k)+'"'+(cur&&cur.k===c.k?' aria-current="page"':'')+'>'+esc(c.t)+'</a>'}).join('');
 var showFeat=STATE==='ok'&&!cur&&!q&&ITEMS.length>0;
 $('feat').hidden=!showFeat;
 if(showFeat){$('fCat').textContent=catName(ITEMS[0].cat);$('fTitle').textContent=ITEMS[0].t}
 var rows=[];
 ITEMS.forEach(function(it,i){
  if(showFeat&&i===0)return;
  if((!cur||it.cat===cur.k)&&(!q||it.t.toLowerCase().indexOf(q)>-1))rows.push(i);
 });
 $('ttl').textContent=cur?cur.t:(q?'Результаты поиска':'Все видео');
 $('cnt').textContent=STATE==='ok'?rows.length+' шт.':'';
 $('grid').innerHTML=STATE==='load'?'<p class="empty mono">Загрузка...</p>':STATE==='err'?'<p class="empty mono">Не удалось загрузить каталог. Обновите страницу.</p>':rows.length?rows.map(function(i){var it=ITEMS[i];return '<a class="card" href="'+esc(it.u)+'" data-i="'+i+'" target="_blank" rel="noopener"><span class="art"><span class="play">▶</span></span><span class="body"><span class="cat">'+esc(catName(it.cat))+'</span><span class="title">'+esc(it.t)+'</span></span></a>'}).join(''):'<p class="empty mono">'+(q?'Ничего не найдено.':'В этом разделе пока пусто.')+'</p>';
 document.title=(cur?cur.t+' · ':'')+'Каталог контента MMP';
}
$('grid').addEventListener('click',function(e){var a=e.target.closest('.card');if(!a||e.ctrlKey||e.metaKey)return;e.preventDefault();openPlayer(+a.dataset.i)});
$('fBtn').onclick=function(){openPlayer(0)};
$('q').addEventListener('input',render);
window.addEventListener('hashchange',render);
render();
fetch('/api/items',{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){ITEMS=d.items||[];CATS=d.cats||[];STATE='ok';render()}).catch(function(){STATE='err';render()});
</script>
</body></html>
