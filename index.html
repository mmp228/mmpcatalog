<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MMP catalog</title>
<meta name="description" content="Новости, клипы, выступления и закулисье. Каталог видео, Астана.">
<meta property="og:title" content="MMP catalog"><meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23ff4f00'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6e6e3;--panel:#f2f2ef;--ink:#161616;--mute:#77776f;--line:#c9c9c3;--acc:#ff4f00;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;--sans:'Onest','Helvetica Neue',Arial,sans-serif}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);padding:clamp(12px,3vw,32px);min-height:100vh}

body{
  --bg:#e6e6e3; --panel:#f2f2ef; --ink:#161616; --mute:#77776f; --line:#c9c9c3; --acc:#ff4f00;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --sans:'Onest','Helvetica Neue',Arial,sans-serif;
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  padding:clamp(12px,3vw,32px); box-sizing:border-box; min-height:100vh;
}
*{box-sizing:border-box;margin:0;padding:0}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:12px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:6px}
.mono{font-family:var(--mono);font-size:12px;color:var(--mute)}

/* шапка */
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:18px;letter-spacing:-.01em}
.dot{width:14px;height:14px;border-radius:50%;background:var(--acc)}
.tg{font-family:var(--mono);font-size:13px;border:1px solid var(--ink);border-radius:999px;padding:8px 16px;transition:background .15s,color .15s}
.tg:hover{background:var(--ink);color:var(--panel)}

/* герой: «экран» устройства */
.hero{display:grid;grid-template-columns:1.6fr 1fr;gap:12px}
.screen{background:var(--ink);color:#f2f2ef;border-radius:6px;padding:22px;min-height:340px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.screen .row{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:12px;color:#a9a9a0}
.led{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--acc);margin-right:8px;animation:mmpblink 1.6s steps(2,end) infinite}
@keyframes mmpblink{50%{opacity:.15}}
.screen h1{font-size:clamp(34px,6vw,72px);line-height:.98;font-weight:800;letter-spacing:-.03em;margin:28px 0}
.screen .btn{align-self:flex-start;background:var(--acc);color:#fff;font-family:var(--mono);font-weight:700;font-size:14px;padding:14px 22px;border-radius:4px;box-shadow:0 4px 0 #a83300;transition:transform .08s,box-shadow .08s}
.screen .btn:hover{transform:translateY(2px);box-shadow:0 2px 0 #a83300}
.screen .btn:active{transform:translateY(4px);box-shadow:0 0 0 #a83300}
.meta{padding:22px;display:flex;flex-direction:column;justify-content:space-between;gap:20px}
.meta dl{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;font-size:15px}
.meta dt{font-family:var(--mono);font-size:12px;color:var(--mute);padding-top:3px}
.meta dd{font-weight:600}

/* пады-разделы */
.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.pad{display:flex;flex-direction:column;justify-content:space-between;min-height:130px;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s,background .15s}
.pad b{font-size:22px;font-weight:800;letter-spacing:-.02em}
.pad span{font-family:var(--mono);font-size:12px;color:var(--mute)}
.pad:hover{background:var(--acc);color:#fff;border-color:var(--acc);transform:translateY(2px);box-shadow:0 2px 0 #a83300}
.pad:hover span{color:#ffe1d3}
.pad:active{transform:translateY(4px);box-shadow:none}

/* список выпусков */
.list-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);gap:12px;flex-wrap:wrap}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:12px;background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.item{display:grid;grid-template-columns:70px 1fr 140px 100px;gap:16px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);transition:background .15s}
.item:last-child{border-bottom:0}
.item:hover{background:#fff}
.item .n{font-family:var(--mono);font-size:13px;color:var(--acc);font-weight:700}
.item .t{font-weight:600;font-size:17px}
.item .c,.item .go{font-family:var(--mono);font-size:12px;color:var(--mute)}
.item .go{text-align:right;color:var(--ink)}
.empty{padding:28px 18px;color:var(--mute);font-family:var(--mono);font-size:13px}

footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:6px 4px}

@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .pads{grid-template-columns:repeat(2,1fr)}
  .item{grid-template-columns:48px 1fr;gap:6px 12px}
  .item .c{grid-column:2}
  .item .go{grid-column:2;text-align:left}
}
@media (prefers-reduced-motion:reduce){.led{animation:none}*{transition:none!important}}

html{scroll-behavior:smooth}body{margin:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font-family:var(--mono);font-size:13px;padding:8px 14px;border:1px solid var(--line);border-radius:999px}
.tab[aria-current="page"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.tab:hover{border-color:var(--ink)}
.hero[hidden],.pads[hidden]{display:none}
.item .n{min-width:0}


.modal{position:fixed;inset:0;z-index:50;background:rgba(22,22,22,.88);display:flex;align-items:center;justify-content:center;padding:clamp(10px,3vw,32px)}
.modal[hidden]{display:none}
.mbox{width:min(820px,100%,calc((100vh - 110px)*1.7778));width:min(820px,100%,calc((100dvh - 110px)*1.7778));min-width:min(100%,300px);display:grid;gap:10px}
.mbar{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#f2f2ef;font-family:var(--mono);font-size:13px}
.mbar b{font-family:var(--sans);font-size:18px;font-weight:800;letter-spacing:-.01em}
.mbar a{border:1px solid #77776f;border-radius:999px;padding:6px 12px;color:#f2f2ef}
.mx{font-family:var(--mono);font-weight:700;font-size:14px;background:var(--acc);color:#fff;border:0;border-radius:4px;padding:10px 16px;cursor:pointer;box-shadow:0 3px 0 #a83300}
.mx:active{transform:translateY(3px);box-shadow:none}
.mv{aspect-ratio:16/9;background:#000;border-radius:6px;overflow:hidden}
.mv iframe,.mv video{width:100%;height:100%;border:0;display:block}
</style></head>
<body>
<div class="wrap">
 <header class="box top">
  <a class="brand" href="#"><span class="dot"></span>MMP catalog</a>
  <nav class="tabs" id="tabs" aria-label="Разделы"></nav>
  <a class="tg" href="https://t.me/+xpuzkNfNDyI2OGMy" target="_blank" rel="noopener">Telegram-канал</a>
 </header>
 <section class="hero" id="hero" aria-label="Новинка">
  <div class="screen">
   <div class="row"><span><i class="led"></i>новый выпуск</span><span id="hMeta"></span></div>
   <h1 id="hTitle"></h1>
   <a class="btn" id="hBtn" target="_blank" rel="noopener">Смотреть</a>
  </div>
  <div class="box meta">
   <dl><dt>рубрика</dt><dd id="hCat"></dd><dt>место</dt><dd id="hPlace"></dd><dt>всего</dt><dd id="hCount"></dd></dl>
   <p class="mono">Подпишитесь на канал, чтобы не пропускать новые выпуски.</p>
  </div>
 </section>
 <nav class="pads" id="pads" aria-label="Разделы"></nav>
 <section class="box" aria-label="Каталог">
  <div class="list-head"><strong id="lTitle">Новинки</strong><span class="mono" id="lCount"></span></div>
  <div id="list"></div>
 </section>
 <footer class="mono"><span>MMP catalog</span><span>Астана</span></footer>
</div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-label="Плеер">
 <div class="mbox">
  <div class="mbar"><b id="mTitle"></b><span style="display:flex;gap:8px;align-items:center"><a id="mOpen" target="_blank" rel="noopener">в новой вкладке</a><button class="mx" id="mClose" type="button">Закрыть</button></span></div>
  <div class="mv" id="mv"></div>
 </div>
</div>
<script>
var CATS={news:'Новости',clips:'Клипы',vystup:'Выступления',zakadrom:'За кадром'};
var ITEMS=[],STATE='load';
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function hero(){
 var L=ITEMS[0];if(!L)return;
 $('hTitle').textContent=L.t;$('hBtn').href=L.u;$('hMeta').textContent=CATS[L.cat]+(L.n?' / '+L.n:'');
 $('hCat').textContent=CATS[L.cat];$('hPlace').textContent=L.place||'-';$('hCount').textContent=ITEMS.length+' видео';
}
function route(){
 var h=location.hash.slice(1),cat=CATS[h]?h:'';
 $('tabs').innerHTML='<a class="tab" href="#"'+(cat?'':' aria-current="page"')+'>Главная</a>'+Object.keys(CATS).map(function(k){return '<a class="tab" href="#'+k+'"'+(k===cat?' aria-current="page"':'')+'>'+CATS[k]+'</a>'}).join('');
 $('hero').hidden=!!cat||!ITEMS.length;$('pads').hidden=!!cat;
 var rows=ITEMS.filter(function(i){return !cat||i.cat===cat});
 $('lTitle').textContent=cat?CATS[cat]:'Новинки';
 $('lCount').textContent=STATE==='ok'?rows.length+' шт.':'';
 $('list').innerHTML=STATE==='load'?'<p class="empty">Загрузка...</p>':STATE==='err'?'<p class="empty">Не удалось загрузить каталог. Обновите страницу.</p>':rows.length?rows.map(function(i){return '<a class="item" data-i="'+ITEMS.indexOf(i)+'" href="'+esc(i.u)+'" target="_blank" rel="noopener"><span class="n">'+esc(i.n)+'</span><span class="t">'+esc(i.t)+'</span><span class="c">'+CATS[i.cat]+'</span><span class="go">&#9654; смотреть</span></a>'}).join(''):'<p class="empty">В этом разделе пока ничего нет.</p>';
 document.title=(cat?CATS[cat]+' · ':'')+'MMP catalog';
}

function embed(u){
 var m;
 if(m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/))return{t:'f',s:'https://www.youtube-nocookie.com/embed/'+m[1]+'?autoplay=1&rel=0'};
 if(m=u.match(/vimeo\.com\/(?:video\/)?(\d+)/))return{t:'f',s:'https://player.vimeo.com/video/'+m[1]+'?autoplay=1'};
 if(m=u.match(/kinescope\.io\/(?:embed\/|watch\/)?([A-Za-z0-9]{10,})/))return{t:'f',s:'https://kinescope.io/embed/'+m[1]};
 if(m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/))return{t:'f',s:'https://drive.google.com/file/d/'+m[1]+'/preview'};
 if(/\.(mp4|webm|mov)(\?|$)/i.test(u))return{t:'v',s:u};
 return null;
}
function openPlayer(i){
 var x=ITEMS[i],e=x&&embed(x.u);
 if(!e){window.open(x.u,'_blank','noopener');return}
 $('mTitle').textContent=x.t;$('mOpen').href=x.u;
 $('mv').innerHTML=e.t==='v'?'<video src="'+esc(e.s)+'" controls autoplay playsinline></video>':'<iframe src="'+esc(e.s)+'" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>';
 $('modal').hidden=false;document.body.style.overflow='hidden';$('mClose').focus();
}
function closePlayer(){$('modal').hidden=true;$('mv').innerHTML='';document.body.style.overflow=''}
$('mClose').onclick=closePlayer;
$('modal').addEventListener('click',function(e){if(e.target===$('modal'))closePlayer()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('modal').hidden)closePlayer()});
$('list').addEventListener('click',function(e){var a=e.target.closest('.item');if(!a||e.ctrlKey||e.metaKey)return;e.preventDefault();openPlayer(+a.dataset.i)});
$('hBtn').addEventListener('click',function(e){if(e.ctrlKey||e.metaKey)return;e.preventDefault();openPlayer(0)});
$('pads').innerHTML=Object.keys(CATS).map(function(k){return '<a class="pad" href="#'+k+'"><span>раздел</span><b>'+CATS[k]+'</b></a>'}).join('');
window.addEventListener('hashchange',route);route();
fetch('/api/items',{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){ITEMS=d;STATE='ok';hero();route()}).catch(function(){STATE='err';route()});
</script>
</body></html>
